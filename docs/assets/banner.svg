<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Baton — switch AI coding accounts, keep one shared history">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2560"/>
      <stop offset="42%" stop-color="#253078"/>
      <stop offset="100%" stop-color="#436CD2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1280" height="360" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- Baton mark, kept clear of the text column so a wider fallback font cannot collide with it. -->
    <g transform="translate(1070 180)">
      <rect x="-135" y="-23" width="270" height="46" rx="23" fill="#ffffff" fill-opacity="0.97" transform="rotate(-43)"/>
      <circle cx="104" cy="100" r="33" fill="#7DD3FC"/>
    </g>

    <g transform="translate(80 62)">
      <rect x="0" y="0" width="40" height="40" rx="11" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.24"/>
      <rect x="5" y="17" width="30" height="6" rx="3" fill="#ffffff" transform="rotate(-43 20 20)"/>
      <circle cx="31" cy="31" r="4.5" fill="#7DD3FC"/>
      <text x="54" y="28" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">Baton</text>
    </g>

    <text x="80" y="180" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" font-weight="500" fill="#A9BDF0">Hit your limit?</text>
    <text x="80" y="248" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="-1.6">Pass the baton.</text>
    <text x="80" y="300" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#C3D1F2">Switch AI coding accounts without losing your history.</text>
  </g>
</svg>

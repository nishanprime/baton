[package]
name = "baton-gui"
version = "0.1.0"
edition = "2021"
description = "Menu bar switcher for AI coding accounts"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

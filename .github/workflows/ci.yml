name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The path logic differs per platform, so it has to be exercised on each.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:cli
      - name: CLI runs and emits valid JSON
        run: node dist/cli.mjs status --json
        shell: bash
      - name: Every CLI command answers
        shell: bash
        run: |
          set -e
          for c in status accounts health sessions usage backups doctor preflight settings pin; do
            node dist/cli.mjs "$c" --json > /dev/null
          done
          node dist/cli.mjs history --limit 1 --json > /dev/null
          node dist/cli.mjs link --all --dry-run --json > /dev/null
      - name: GUI frontend parses
        shell: bash
        run: |
          node --check gui/ui/app.js
          test -f gui/ui/index.html
          test -f gui/ui/app.css

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
